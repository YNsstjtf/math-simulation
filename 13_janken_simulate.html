<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>勝ち負けシミュレーション</title>
  <style>
    body{
      font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
      background-color:#f0f2f5;
      color:#333;
      margin:0;
      padding:20px;
      display:flex;
      justify-content:center;
      min-height:100vh;
    }
    .wrap{width:100%;max-width:820px;}
    h1{
      font-size:1.2rem;
      margin:0 0 10px;
      color:#444;
      border-bottom:2px solid #eee;
      padding-bottom:10px;
    }
    .card{
      background:#fff;
      border-radius:12px;
      box-shadow:0 4px 6px rgba(0,0,0,0.1);
      padding:20px;
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn-group{display:flex;gap:10px;width:100%;}
    button{
      border:none;
      padding:12px 16px;
      font-size:1rem;
      border-radius:6px;
      cursor:pointer;
      transition:background-color .2s;
      font-weight:bold;
      flex:1;
    }
    .btn-primary{background-color:#007bff;color:#fff;}
    .btn-primary:hover{background-color:#0056b3;}
    .btn-secondary{background-color:#6c757d;color:#fff;}
    .btn-secondary:hover{background-color:#5a6268;}

    .pill{
      display:inline-block;
      padding:4px 10px;
      border:1px solid #aaa;
      border-radius:999px;
      background:#fff;
      font-size:0.95rem;
      white-space:nowrap;
    }
    .note{font-size:0.85rem;color:#666;}

    .scoreboard{
      margin-top:12px;
      border-radius:12px;
      background:#fafafa;
      border:1px solid #eee;
      padding:14px 14px;
    }
    .score-big{
      font-size:1.35rem;
      font-weight:800;
      letter-spacing:0.5px;
      color:#333;
    }
    .score-sub{
      margin-top:6px;
      font-size:0.9rem;
      color:#666;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .hint{
      margin-top:10px;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #eee;
      background:#fff;
      font-weight:800;
      color:#444;
      display:none;
    }
    .hint.show{display:block;}
    .hint.strong{background-color:#eef5ff;border-color:#9dc1ff;color:#1f3f7a;}
    .hint.weak{background-color:#fff0f0;border-color:#e0a0a0;color:#8a1c1c;}

    .legend{
      margin-top:10px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .tag{
      display:inline-flex;
      gap:6px;
      align-items:center;
      padding:3px 10px;
      border-radius:999px;
      border:1px solid #ddd;
      background:#fff;
      font-size:0.85rem;
      color:#555;
    }
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

    .viz{
      margin-top:12px;
      padding:14px;
      border:1px solid #eee;
      border-radius:12px;
      background:#fafafa;
    }
    .viz-head{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:baseline;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .viz-title{font-weight:800;color:#444;}
    .viz-sub{font-size:0.9rem;color:#666;}
    canvas{
      width:100%;
      height:220px;
      display:block;
      border-radius:10px;
      background:#fff;
      border:1px solid #eee;
    }

    .results{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:8px;
      margin-top:12px;

      max-height:420px;
      overflow-y:auto;
      padding-right:4px;
      border-radius:12px;
      border:1px solid #eee;
      background:#fff;
      padding:10px;
    }
    .results::-webkit-scrollbar{width:10px;}
    .results::-webkit-scrollbar-thumb{background:#d5d5d5;border-radius:999px;}
    .results::-webkit-scrollbar-track{background:#f3f3f3;border-radius:999px;}

    .cell{
      border-radius:10px;
      padding:10px 10px;
      text-align:left;
      border:1px solid #eee;
      background:#fafafa;
      line-height:1.25;
    }
    .cell .nth{font-size:0.85rem;color:#666;margin-bottom:6px;}
    .cell .res{font-size:1.15rem;font-weight:900;}

    .win{background-color:#e6f7ea;border-color:#8fd19e;color:#1f6b2e;}
    .lose{background-color:#fff0f0;border-color:#e0a0a0;color:#8a1c1c;}
    @media (max-width: 520px){ .results{max-height:480px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>勝ち負けシミュレーション</h1>

      <div class="row">
        <div class="btn-group">
          <button id="run1"  class="btn-primary">1回</button>
          <button id="run10" class="btn-primary">10回</button>
          <button id="run50" class="btn-primary">50回</button>
          <button id="resetBtn" class="btn-secondary">リセット</button>
        </div>
      </div>

      <div class="scoreboard" aria-live="polite">
        <div class="score-big" id="scoreBig">0勝0敗（勝率 0.0%）</div>

        <div class="score-sub">
          <span class="pill">試行回数：<span id="trials">0</span></span>
          <span class="pill">Z値：<span id="zval">–</span></span>

          <span class="pill">判定方式：
            <select id="modeSel" style="font-size:0.95rem; padding:6px 8px; border-radius:8px; border:1px solid #ccc;">
              <option value="two" selected>両側</option>
              <option value="one">片側</option>
            </select>
          </span>

          <span class="pill">有意水準 α：
            <select id="alphaSel" style="font-size:0.95rem; padding:6px 8px; border-radius:8px; border:1px solid #ccc;">
              <option value="0.20">0.20</option>
              <option value="0.10">0.10</option>
              <option value="0.05" selected>0.05</option>
              <option value="0.02">0.02</option>
              <option value="0.01">0.01</option>
            </select>
          </span>

          <span class="note">※勝ち/負けは等確率(1/2)。Z値は正規近似で「今どこにいるか」の目安。</span>
        </div>

        <div id="modeNote" class="note" style="margin-top:6px;"></div>

        <div id="hint" class="hint" role="status"></div>

        <div class="legend" aria-hidden="true">
          <span class="tag"><span class="dot" style="background:#8fd19e"></span>勝ち</span>
          <span class="tag"><span class="dot" style="background:#e0a0a0"></span>負け</span>
        </div>
      </div>

      <div class="viz">
        <div class="viz-head">
          <div class="viz-title">正規分布曲線（勝ち数の正規近似）</div>
          <div class="viz-sub" id="vizSub">n=0 のため表示は目安のみ</div>
        </div>
        <canvas id="normCanvas" width="820" height="220" aria-label="正規分布曲線と現在位置"></canvas>
      </div>

      <div class="results" id="results" aria-label="試行ログ（スクロール）"></div>
    </div>
  </div>

<script>
"use strict";

/* ===== DOM ===== */
const run1  = document.getElementById("run1");
const run10 = document.getElementById("run10");
const run50 = document.getElementById("run50");
const resetBtn = document.getElementById("resetBtn");

const resultsEl = document.getElementById("results");
const scoreBigEl = document.getElementById("scoreBig");
const trialsEl = document.getElementById("trials");
const zvalEl = document.getElementById("zval");
const hintEl = document.getElementById("hint");

const modeSel = document.getElementById("modeSel");
const alphaSel = document.getElementById("alphaSel");
const modeNote = document.getElementById("modeNote");

const canvas = document.getElementById("normCanvas");
const ctx = canvas.getContext("2d");
const vizSub = document.getElementById("vizSub");

/* ===== 状態 ===== */
let wins = 0;
let losses = 0;
let trials = 0;

function alpha(){
  return parseFloat(alphaSel.value || "0.05");
}
function mode(){
  return modeSel.value || "two"; // "two" or "one"
}

function winRate(){
  const denom = wins + losses;
  if (denom === 0) return 0;
  return wins / denom;
}
function oneTrial(){
  return (Math.random() < 0.5) ? "win" : "lose";
}

/* ===== 標準正規の密度 ===== */
function phi(z){
  return Math.exp(-0.5*z*z) / Math.sqrt(2*Math.PI);
}

/* 勝ち数の正規近似にもとづくZ値 */
function currentZ(){
  if (trials === 0) return null;
  const mu = trials / 2;
  const sigma = Math.sqrt(trials / 4);
  if (sigma === 0) return null;
  return (wins - mu) / sigma;
}

/* 標準正規の逆関数（近似） */
function normInv(p){
  const eps = 1e-12;
  p = Math.min(1-eps, Math.max(eps, p));

  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];

  const plow = 0.02425;
  const phigh = 1 - plow;
  let q, r;

  if (p < plow){
    q = Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
           ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }
  if (phigh < p){
    q = Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5]) /
            ((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
  }

  q = p - 0.5;
  r = q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5]) * q /
         (((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* 臨界値 zc を作る
   - 両側：P(|Z|>zc)=α なので zc = Φ^{-1}(1-α/2)
   - 片側：P(Z>zc)=α     なので zc = Φ^{-1}(1-α)
*/
function zCritical(){
  const a = alpha();
  if (mode() === "one"){
    return normInv(1 - a);
  }
  return normInv(1 - a/2);
}

function modeLabel(){
  if (mode() === "one") return `片側α=${alpha().toFixed(2)}`;
  return `両側α=${alpha().toFixed(2)}`;
}

/* 強い／弱いメッセージ */
function updateHint(z){
  hintEl.className = "hint";
  hintEl.textContent = "";
  if (z === null) return;

  const zc = zCritical();
  const zcStr = zc.toFixed(2);

  // 片側モードでも「強い／弱い」を両方出したい、という要望に合わせて
  // 右側・左側とも同じ zc で判定する（見え方重視）。
  if (z > zc){
    hintEl.textContent = `強くね？（Z > ${zcStr}｜${modeLabel()}）`;
    hintEl.classList.add("show","strong");
  } else if (z < -zc){
    hintEl.textContent = `弱くね？（Z < -${zcStr}｜${modeLabel()}）`;
    hintEl.classList.add("show","weak");
  }
}

function updateModeNote(){
  const aPct = (alpha()*100).toFixed(0);
  if (mode() === "one"){
    modeNote.textContent =
      `片側モード：右側と左側をそれぞれ「片側${aPct}%」で判定（強い／弱いを両方出すため）。※厳密には両側で見る話に近づくでござる。`;
  } else {
    modeNote.textContent =
      `両側モード：左右に ${aPct/2}% ずつ割り振って判定。`;
  }
}

/* 表示更新 */
function updateUI(){
  const rate = (winRate() * 100).toFixed(1);
  scoreBigEl.textContent = `${wins}勝${losses}敗（勝率 ${rate}%）`;
  trialsEl.textContent = String(trials);

  const z = currentZ();
  zvalEl.textContent = (z === null) ? "–" : z.toFixed(2);

  updateModeNote();
  updateHint(z);
  drawNormal();
}

/* ===== 正規分布ビュー描画（±zc点線つき） ===== */
function drawNormal(){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;

  const W = Math.max(420, Math.floor(cssW || 820));
  const H = Math.max(200, Math.floor(cssH || 220));

  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const padL = 38, padR = 14, padT = 14, padB = 28;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,W,H);

  // x軸
  ctx.strokeStyle = "#e5e5e5";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT + plotH);
  ctx.lineTo(padL + plotW, padT + plotH);
  ctx.stroke();

  const zMin = -4, zMax = 4;
  function xFromZ(z){ return padL + ((z - zMin) / (zMax - zMin)) * plotW; }
  const maxPhi = phi(0);
  function yFromPhi(p){ return padT + plotH - (p / maxPhi) * plotH; }

  // 正規曲線
  ctx.strokeStyle = "#007bff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  const steps = 240;
  for (let i=0;i<=steps;i++){
    const z = zMin + (zMax-zMin)*(i/steps);
    const p = phi(z);
    const x = xFromZ(z);
    const y = yFromPhi(p);
    if (i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();

  // 目盛り
  ctx.fillStyle = "#666";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let t=-3; t<=3; t++){
    const x = xFromZ(t);
    ctx.strokeStyle = "#f0f0f0";
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x, padT);
    ctx.lineTo(x, padT+plotH);
    ctx.stroke();
    ctx.fillText(String(t), x, padT+plotH+6);
  }

  // ±zc 点線
  const zc = zCritical();
  const zcAbs = Math.max(0, Math.min(Math.abs(zc), zMax));
  const xPlus = xFromZ(zcAbs);
  const xMinus = xFromZ(-zcAbs);

  ctx.strokeStyle = "#999";
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6,4]);

  ctx.beginPath(); ctx.moveTo(xPlus, padT);  ctx.lineTo(xPlus, padT+plotH);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xMinus, padT); ctx.lineTo(xMinus, padT+plotH); ctx.stroke();

  ctx.setLineDash([]);

  // ラベル
  ctx.fillStyle = "#666";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillText(`+zc=${zc.toFixed(2)}`, xPlus,  padT + 14);
  ctx.fillText(`-zc=${(-zc).toFixed(2)}`, xMinus, padT + 14);

  const z = currentZ();
  if (z === null){
    vizSub.textContent = `n=0（境界：±zc=${zc.toFixed(2)}｜${modeLabel()}）`;
    return;
  }

  const zClamped = Math.max(zMin, Math.min(zMax, z));
  const xZ = xFromZ(zClamped);
  const yZ = yFromPhi(phi(zClamped));

  // 現在位置の線と点
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(xZ, padT);
  ctx.lineTo(xZ, padT+plotH);
  ctx.stroke();

  ctx.fillStyle = "#333";
  ctx.beginPath();
  ctx.arc(xZ, yZ, 4.5, 0, 2*Math.PI);
  ctx.fill();

  // ラベル
  ctx.fillStyle = "#333";
  ctx.font = "12px sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "bottom";
  const label = `現在：Z=${z.toFixed(2)}`;
  const lx = Math.min(W - padR - 140, xZ + 8);
  const ly = Math.max(padT + 16, yZ - 8);
  ctx.fillText(label, lx, ly);

  const mu = trials/2;
  const sigma = Math.sqrt(trials/4);
  vizSub.textContent =
    `n=${trials}，期待値 n/2=${mu.toFixed(1)}，標準偏差 √(n/4)=${sigma.toFixed(2)}（境界：±zc=${zc.toFixed(2)}｜${modeLabel()}）`;
}

/* ===== 試行ログ ===== */
function simulate(n){
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++){
    const r = oneTrial();
    trials += 1;
    if (r === "win") wins += 1;
    else losses += 1;

    const div = document.createElement("div");
    div.className = "cell " + r;
    div.innerHTML = `
      <div class="nth">${trials}回目</div>
      <div class="res">${(r === "win") ? "勝ち" : "負け"}</div>
    `;
    frag.appendChild(div);
  }
  resultsEl.appendChild(frag);
  updateUI();
  resultsEl.scrollTo({ top: resultsEl.scrollHeight, behavior: "smooth" });
}

function resetAll(){
  wins = 0; losses = 0; trials = 0;
  resultsEl.innerHTML = "";
  updateUI();
}

/* ===== イベント ===== */
run1.addEventListener("click",  () => simulate(1));
run10.addEventListener("click", () => simulate(10));
run50.addEventListener("click", () => simulate(50));
resetBtn.addEventListener("click", resetAll);

window.addEventListener("resize", () => drawNormal());
modeSel.addEventListener("change", () => updateUI());
alphaSel.addEventListener("change", () => updateUI());

updateUI();
</script>
</body>
</html>
